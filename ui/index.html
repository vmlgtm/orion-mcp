<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma to Responsive HTML Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
            }
          }
        }
      }
    }
  </script>
  <style>
    .transition-width {
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans text-slate-900 antialiased">
  <!-- Top Navigation Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-violet-600 to-indigo-500 flex items-center justify-center text-white font-bold shadow-md shadow-violet-200">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
          </svg>
        </div>
        <div>
          <h1 class="font-semibold text-lg leading-none tracking-tight">Figma to Responsive HTML</h1>
          <p class="text-xs text-slate-500 mt-1">MCP-Powered Desktop & Mobile Frame Fusion</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <span id="systemStatusBadge" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-700">
          <span class="w-2 h-2 mr-1.5 rounded-full bg-slate-400"></span>
          Ready
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    <!-- Input Form Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6">
      <form id="convertForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Desktop Figma URL -->
          <div>
            <label for="desktopUrl" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5 flex items-center justify-between">
              <span>Desktop Frame URL</span>
              <span class="text-slate-400 font-normal lowercase text-[11px]">(node-id required)</span>
            </label>
            <div class="relative">
              <input
                type="url"
                id="desktopUrl"
                required
                placeholder="https://www.figma.com/design/:key/:title?node-id=10:234"
                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 focus:bg-white transition"
              />
            </div>
          </div>

          <!-- Mobile Figma URL -->
          <div>
            <label for="mobileUrl" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5 flex items-center justify-between">
              <span>Mobile Frame URL</span>
              <span class="text-slate-400 font-normal lowercase text-[11px]">(node-id required)</span>
            </label>
            <div class="relative">
              <input
                type="url"
                id="mobileUrl"
                required
                placeholder="https://www.figma.com/design/:key/:title?node-id=10:567"
                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 focus:bg-white transition"
              />
            </div>
          </div>
        </div>

        <div class="flex items-center justify-between pt-2">
          <p class="text-xs text-slate-500">
            Paste both Figma frame URLs. The MCP agent inspects sections and synthesizes responsive Tailwind CSS.
          </p>
          <button
            type="submit"
            id="convertBtn"
            class="inline-flex items-center justify-center px-6 py-2.5 bg-violet-600 hover:bg-violet-700 text-white font-medium text-sm rounded-xl shadow-md shadow-violet-200 transition focus:outline-none focus:ring-2 focus:ring-violet-500 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <svg id="convertSpinner" class="hidden animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            <span id="convertBtnText">Convert to Responsive HTML</span>
          </button>
        </div>
      </form>

      <!-- Error Notification Banner -->
      <div id="errorBanner" class="hidden mt-4 p-4 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm">
        <div class="flex items-start">
          <svg class="w-5 h-5 text-red-500 mr-2.5 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
          </svg>
          <div class="flex-1">
            <p class="font-medium" id="errorMessage">An error occurred.</p>
          </div>
          <button id="dismissErrorBtn" class="text-red-400 hover:text-red-600">
            <span class="sr-only">Dismiss</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Live Progress Display -->
      <div id="progressSection" class="hidden mt-4 pt-4 border-t border-slate-100">
        <div class="flex items-center justify-between text-xs text-slate-500 mb-2">
          <span class="font-medium text-slate-700">Conversion Progress</span>
          <span id="progressTimer">0s elapsed</span>
        </div>
        <div class="p-3 bg-slate-900 rounded-xl text-slate-200 text-xs font-mono max-h-36 overflow-y-auto space-y-1.5" id="progressLog">
          <!-- Dynamic progress lines -->
        </div>
      </div>
    </div>

    <!-- Output Preview Section -->
    <div id="outputSection" class="hidden space-y-4">
      <!-- Toolbar -->
      <div class="flex flex-wrap items-center justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
        <div class="flex items-center space-x-2">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 mr-1">Preview Mode:</span>
          <button
            type="button"
            id="viewportDesktop"
            class="viewport-btn active px-3 py-1.5 rounded-lg text-xs font-medium bg-violet-100 text-violet-700 hover:bg-violet-200 transition"
          >
            Desktop (100%)
          </button>
          <button
            type="button"
            id="viewportTablet"
            class="viewport-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition"
          >
            Tablet (768px)
          </button>
          <button
            type="button"
            id="viewportMobile"
            class="viewport-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition"
          >
            Mobile (375px)
          </button>
        </div>

        <div class="flex items-center space-x-2">
          <button
            type="button"
            id="toggleSourceBtn"
            class="px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-300 text-slate-700 hover:bg-slate-50 transition flex items-center space-x-1"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
            </svg>
            <span id="toggleSourceText">View HTML Code</span>
          </button>
          <button
            type="button"
            id="copyHtmlBtn"
            class="px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition flex items-center space-x-1.5"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
            </svg>
            <span id="copyBtnText">Copy HTML</span>
          </button>
          <button
            type="button"
            id="downloadHtmlBtn"
            class="px-3.5 py-1.5 rounded-lg text-xs font-medium bg-violet-600 text-white hover:bg-violet-700 shadow-sm transition flex items-center space-x-1.5"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            <span>Download HTML</span>
          </button>
        </div>
      </div>

      <!-- Preview Stage -->
      <div class="bg-slate-200/70 p-4 sm:p-8 rounded-2xl border border-slate-300/80 flex justify-center items-start overflow-x-auto min-h-[700px]">
        <!-- Responsive Wrapper -->
        <div id="frameContainer" class="w-full transition-width bg-white rounded-xl shadow-xl overflow-hidden border border-slate-300">
          <iframe
            id="previewIframe"
            title="Generated Responsive HTML Preview"
            class="w-full h-[700px] border-0"
            sandbox="allow-scripts allow-same-origin"
          ></iframe>
        </div>

        <!-- Raw Source View (Hidden by default) -->
        <div id="sourceContainer" class="hidden w-full bg-slate-900 rounded-xl shadow-xl overflow-hidden text-slate-100 p-4">
          <pre class="font-mono text-xs overflow-x-auto max-h-[680px]"><code id="rawSourceCode"></code></pre>
        </div>
      </div>
    </div>
  </main>

  <script>
    // State management
    let generatedHtml = '';
    let isConverting = false;
    let timerInterval = null;
    let startTime = null;

    // DOM Elements
    const form = document.getElementById('convertForm');
    const desktopInput = document.getElementById('desktopUrl');
    const mobileInput = document.getElementById('mobileUrl');
    const convertBtn = document.getElementById('convertBtn');
    const convertBtnText = document.getElementById('convertBtnText');
    const convertSpinner = document.getElementById('convertSpinner');
    const errorBanner = document.getElementById('errorBanner');
    const errorMessage = document.getElementById('errorMessage');
    const dismissErrorBtn = document.getElementById('dismissErrorBtn');
    const progressSection = document.getElementById('progressSection');
    const progressLog = document.getElementById('progressLog');
    const progressTimer = document.getElementById('progressTimer');
    const systemStatusBadge = document.getElementById('systemStatusBadge');

    const outputSection = document.getElementById('outputSection');
    const previewIframe = document.getElementById('previewIframe');
    const frameContainer = document.getElementById('frameContainer');
    const sourceContainer = document.getElementById('sourceContainer');
    const rawSourceCode = document.getElementById('rawSourceCode');
    const toggleSourceBtn = document.getElementById('toggleSourceBtn');
    const toggleSourceText = document.getElementById('toggleSourceText');
    const copyHtmlBtn = document.getElementById('copyHtmlBtn');
    const copyBtnText = document.getElementById('copyBtnText');
    const downloadHtmlBtn = document.getElementById('downloadHtmlBtn');

    const viewportDesktop = document.getElementById('viewportDesktop');
    const viewportTablet = document.getElementById('viewportTablet');
    const viewportMobile = document.getElementById('viewportMobile');
    const viewportBtns = [viewportDesktop, viewportTablet, viewportMobile];

    // Helper to log progress items
    function appendProgress(message, isError = false) {
      const line = document.createElement('div');
      line.className = 'flex items-start space-x-2 ' + (isError ? 'text-red-400' : 'text-slate-300');
      
      const time = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
      line.innerHTML = `<span class="text-slate-500 shrink-0 font-mono">[${time}]</span> <span>${message}</span>`;
      progressLog.appendChild(line);
      progressLog.scrollTop = progressLog.scrollHeight;
    }

    function setStatus(text, type = 'idle') {
      let colorClass = 'bg-slate-100 text-slate-700';
      let dotColor = 'bg-slate-400';

      if (type === 'running') {
        colorClass = 'bg-amber-50 text-amber-700 border border-amber-200';
        dotColor = 'bg-amber-500 animate-pulse';
      } else if (type === 'success') {
        colorClass = 'bg-emerald-50 text-emerald-700 border border-emerald-200';
        dotColor = 'bg-emerald-500';
      } else if (type === 'error') {
        colorClass = 'bg-red-50 text-red-700 border border-red-200';
        dotColor = 'bg-red-500';
      }

      systemStatusBadge.className = `inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium ${colorClass}`;
      systemStatusBadge.innerHTML = `<span class="w-2 h-2 mr-1.5 rounded-full ${dotColor}"></span>${text}`;
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      errorBanner.classList.remove('hidden');
      setStatus('Conversion Failed', 'error');
    }

    dismissErrorBtn.addEventListener('click', () => {
      errorBanner.classList.add('hidden');
    });

    // Viewport Toggle Handlers
    function setViewport(width, activeBtn) {
      viewportBtns.forEach(btn => {
        btn.classList.remove('bg-violet-100', 'text-violet-700');
        btn.classList.add('bg-slate-100', 'text-slate-600');
      });
      activeBtn.classList.remove('bg-slate-100', 'text-slate-600');
      activeBtn.classList.add('bg-violet-100', 'text-violet-700');

      frameContainer.style.width = width;
    }

    viewportDesktop.addEventListener('click', () => setViewport('100%', viewportDesktop));
    viewportTablet.addEventListener('click', () => setViewport('768px', viewportTablet));
    viewportMobile.addEventListener('click', () => setViewport('375px', viewportMobile));

    // Toggle Raw Source View
    let isViewingSource = false;
    toggleSourceBtn.addEventListener('click', () => {
      isViewingSource = !isViewingSource;
      if (isViewingSource) {
        frameContainer.classList.add('hidden');
        sourceContainer.classList.remove('hidden');
        rawSourceCode.textContent = generatedHtml;
        toggleSourceText.textContent = 'View Preview';
      } else {
        sourceContainer.classList.add('hidden');
        frameContainer.classList.remove('hidden');
        toggleSourceText.textContent = 'View HTML Code';
      }
    });

    // Copy to Clipboard
    copyHtmlBtn.addEventListener('click', async () => {
      if (!generatedHtml) return;
      try {
        await navigator.clipboard.writeText(generatedHtml);
        copyBtnText.textContent = 'Copied!';
        copyHtmlBtn.classList.add('bg-emerald-100', 'text-emerald-800');
        setTimeout(() => {
          copyBtnText.textContent = 'Copy HTML';
          copyHtmlBtn.classList.remove('bg-emerald-100', 'text-emerald-800');
        }, 2000);
      } catch (err) {
        alert('Failed to copy to clipboard.');
      }
    });

    // Download HTML file
    downloadHtmlBtn.addEventListener('click', () => {
      if (!generatedHtml) return;
      const blob = new Blob([generatedHtml], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'converted-page.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // Form submission & SSE Streaming
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isConverting) return;

      const desktopUrl = desktopInput.value.trim();
      const mobileUrl = mobileInput.value.trim();

      if (!desktopUrl || !mobileUrl) {
        showError('Please enter both desktop and mobile Figma frame URLs.');
        return;
      }

      // Reset state
      errorBanner.classList.add('hidden');
      progressSection.classList.remove('hidden');
      progressLog.innerHTML = '';
      outputSection.classList.add('hidden');
      isConverting = true;

      convertBtn.disabled = true;
      convertSpinner.classList.remove('hidden');
      convertBtnText.textContent = 'Converting...';
      setStatus('Converting...', 'running');

      startTime = Date.now();
      timerInterval = setInterval(() => {
        const sec = Math.floor((Date.now() - startTime) / 1000);
        progressTimer.textContent = `${sec}s elapsed`;
      }, 1000);

      appendProgress('Initiating conversion request...');

      try {
        const response = await fetch('/api/convert', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ desktopUrl, mobileUrl }),
        });

        if (!response.ok) {
          let errText = `HTTP error ${response.status}`;
          try {
            const errJson = await response.json();
            if (errJson.error) errText = errJson.error;
          } catch {}
          throw new Error(errText);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const blocks = buffer.split('\n\n');
          buffer = blocks.pop() || ''; // Keep trailing incomplete block in buffer

          for (const block of blocks) {
            if (!block.trim()) continue;

            let eventType = 'message';
            let eventData = '';

            const lines = block.split('\n');
            for (const line of lines) {
              const trimmed = line.trim();
              if (trimmed.startsWith('event:')) {
                eventType = trimmed.slice(6).trim();
              } else if (trimmed.startsWith('data:')) {
                eventData = trimmed.slice(5).trim();
              }
            }

            if (eventData) {
              try {
                const parsed = JSON.parse(eventData);
                if (eventType === 'progress') {
                  appendProgress(parsed.message || 'Processing...');
                } else if (eventType === 'done') {
                  generatedHtml = parsed.html || '';
                  previewIframe.srcdoc = generatedHtml;
                  outputSection.classList.remove('hidden');
                  setStatus('Completed', 'success');
                  appendProgress('Ready! Responsive HTML preview is loaded below.');
                } else if (eventType === 'error') {
                  showError(parsed.error || 'Unknown conversion error.');
                  appendProgress(`Error: ${parsed.error}`, true);
                }
              } catch (err) {
                console.warn('Unable to parse SSE chunk:', eventData, err);
              }
            }
          }
        }
      } catch (err) {
        showError(err.message || 'Failed to connect to the conversion server.');
        appendProgress(`Failed: ${err.message}`, true);
      } finally {
        isConverting = false;
        clearInterval(timerInterval);
        convertBtn.disabled = false;
        convertSpinner.classList.add('hidden');
        convertBtnText.textContent = 'Convert to Responsive HTML';
      }
    });
  </script>
</body>
</html>
